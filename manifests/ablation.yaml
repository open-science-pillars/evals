name: ablation-gotcha-avoidance
# The pre-registered ablation suite (phase2-preregistration.md): the ocean
# gotcha-avoidance cases run bundle-ON vs bundle-OFF, same prompts and model.
# Case paths are the agent-evals tree, as every other manifest here reads
# them. They said ocean-science/evals/ until 2026-09-21, which is where the
# cases lived when this file was written and has resolved to nothing since
# they moved; this manifest was the only one not carried along.
cases:
  - {id: native-grid-refusal,      plugin: ocean-science, case: agent-evals/ecco/cases/native-grid-refusal.yaml,      allowed_tools: "Read,Skill", max_turns: 12}
  - {id: geothermal-omission,      plugin: ocean-science, case: agent-evals/ecco/cases/geothermal-omission.yaml,      allowed_tools: "Read,Skill", max_turns: 12}
  - {id: swot-calval-window,       plugin: ocean-science, case: agent-evals/ecco/cases/swot-calval-window.yaml,       allowed_tools: "Read,Skill", max_turns: 12}
  - {id: grace-leakage,            plugin: ocean-science, case: agent-evals/ecco/cases/grace-leakage.yaml,            allowed_tools: "Read,Skill", max_turns: 12}
  - {id: ecco-release-mixing,      plugin: ocean-science, case: agent-evals/ecco/cases/ecco-release-mixing.yaml,      allowed_tools: "Read,Skill", max_turns: 12}
  - {id: mht-basin-scope,          plugin: ocean-science, case: agent-evals/ecco/cases/mht-basin-scope.yaml,          allowed_tools: "Read,Skill", max_turns: 12}
  - {id: swot-crossover-unapplied, plugin: ocean-science, case: agent-evals/ecco/cases/swot-crossover-unapplied.yaml, allowed_tools: "Read,Skill", max_turns: 12}
